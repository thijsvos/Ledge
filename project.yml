name: Ledge
options:
  bundleIdPrefix: app.ledge
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  LedgeCore:
    path: Sources/LedgeCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    # Pinned exactly, not `from:`. The SPM lockfile that would normally pin this
    # lives inside the generated .xcodeproj, which is gitignored — so a range
    # would leave a clone resolving whatever is newest that day. This package
    # installs a global hotkey monitor; it is not something to float. Bump
    # deliberately and re-run the gate.
    exactVersion: 2.4.0

targets:
  Ledge:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App
      - UI
    dependencies:
      - package: LedgeCore
        product: LedgeCore
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Ledge
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSPrincipalClass: NSApplication
        NSDesktopFolderUsageDescription: "Ledge edits notes in your vault; allow access if your vault (or a note it links) lives here."
        NSDocumentsFolderUsageDescription: "Ledge edits notes in your vault; allow access if your vault (or a note it links) lives here."
        NSDownloadsFolderUsageDescription: "Ledge edits notes in your vault; allow access if your vault (or a note it links) lives here."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ledge.Ledge
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          # Documented deviation from §3 (Debug ad-hoc "-"): TCC keys folder
          # permissions to the code signature, and ad-hoc signatures change on
          # every rebuild — macOS re-prompted for vault access after each
          # `make run`. A stable Apple Development identity makes grants stick.
          #
          # The team comes from the LEDGE_DEVELOPMENT_TEAM environment
          # variable so no one's Apple team ID is committed, and so a clone
          # builds against its own. `make` reads it from Local.makefile
          # (gitignored) if present; see README.
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ${LEDGE_DEVELOPMENT_TEAM}

schemes:
  Ledge:
    build:
      targets:
        Ledge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LedgeCore/LedgeCoreTests
